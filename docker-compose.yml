services:
  mysql:
    image: mysql:8.0
    container_name: tulian-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=500
      --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${TL_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  mall:
    image: tulian-tea-mall:latest
    container_name: tulian-mall
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TL_MALL_PORT:-8080}:8080"
    volumes:
      - mall-storage:/storage
      - mall-logs:/logs
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  mall-storage:
  mall-logs:
